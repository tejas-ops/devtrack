# hpa.yaml — Horizontal Pod Autoscaler
#
# Automatically scales the number of pods based on CPU/memory usage.
# This is what makes Kubernetes "self-healing" at scale.
#
# INTERVIEW SCENARIO:
#   "Your API has a traffic spike at 9am every morning. How do you handle it?"
#   Answer: HPA scales pods UP when CPU > 70%, scales DOWN when load drops.
#
# HPA requires metrics-server to be installed in the cluster.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name:      devtrack-api-hpa
  namespace: devtrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       devtrack-api   # which Deployment to scale

  minReplicas: 2   # never go below 2 (always have HA)
  maxReplicas: 10  # never go above 10 (cost control)

  metrics:
    # Scale based on CPU usage
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70   # scale out when avg CPU > 70%

    # Scale based on memory usage
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # wait 60s before scaling up again
      policies:
        - type:          Pods
          value:         2             # add max 2 pods per scale-up event
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # wait 5 mins before scaling down
      # WHY longer window for scale down?
      # Prevents "flapping" — pod count jumping up and down rapidly
