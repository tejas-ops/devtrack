# secret.yaml — store SENSITIVE values
#
# IMPORTANT: In real projects, DO NOT commit actual secret values to git.
# Use one of:
#   1. Azure KeyVault + Secrets Store CSI Driver (mounts secrets as files/env vars)
#   2. kubectl create secret generic ... (manual, one-off)
#   3. sealed-secrets (encrypted, safe to commit)
#   4. External Secrets Operator (syncs from KeyVault/AWS Secrets Manager)
#
# Values below are base64-encoded (NOT encrypted — just encoded):
#   echo -n "your-secret" | base64

apiVersion: v1
kind: Secret
metadata:
  name:      devtrack-secrets
  namespace: devtrack
  labels:
    app: devtrack
type: Opaque   # generic secret (as opposed to kubernetes.io/tls, etc.)
data:
  # echo -n "postgresql://devtrack:password@postgres:5432/devtrack" | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL2RldnRyYWNrOnBhc3N3b3JkQHBvc3RncmVzOjU0MzIvZGV2dHJhY2s=

  # echo -n "your-secret-api-key" | base64
  API_SECRET_KEY: eW91ci1zZWNyZXQtYXBpLWtleQ==
