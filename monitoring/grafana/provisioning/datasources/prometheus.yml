# Auto-configure Grafana to use Prometheus as a datasource
# This file runs when Grafana starts — no manual UI setup needed.
# That's "infrastructure as code" applied to monitoring config.

apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://prometheus:9090   # Prometheus service name in Docker Compose
    isDefault: true
